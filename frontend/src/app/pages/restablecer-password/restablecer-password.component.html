<div class="login-page">
  <div class="login-wrap">
    <aside class="login-brand">
      <div class="login-logos">
        <img [src]="logoTecnm" alt="TecNM" class="login-logo" />
        <img [src]="logoItvo" alt="ITVO" class="login-logo" />
      </div>
      <p class="login-kicker">Acceso institucional</p>
      <h1 class="login-titulo">SITVO</h1>
      <p class="login-subtitulo">Sistema Integral de Titulación del Valle de Oaxaca</p>
    </aside>
    <div class="login-card">
      <form (ngSubmit)="onSubmit()" class="login-form">
        <h2 class="login-form-titulo">Nueva contraseña</h2>
        <p class="login-recuperar-info">
          Elige una contraseña nueva (mínimo 8 caracteres). El enlace del correo caduca en 30 minutos.
        </p>

        <ng-container *ngIf="!tokenFaltante && !mensaje">
          <label for="password">Nueva contraseña</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            [disabled]="enviando"
          />
          <label for="passwordConfirm">Confirmar contraseña</label>
          <input
            id="passwordConfirm"
            type="password"
            [(ngModel)]="passwordConfirm"
            name="passwordConfirm"
            autocomplete="new-password"
            [disabled]="enviando"
          />
        </ng-container>

        <p *ngIf="error" class="error">{{ error }}</p>
        <p *ngIf="mensaje" class="login-recuperar-ok">{{ mensaje }}</p>

        <button
          *ngIf="!tokenFaltante && !mensaje"
          type="submit"
          class="btn-login"
          [disabled]="enviando"
        >
          {{ enviando ? 'Guardando...' : 'Guardar contraseña' }}
        </button>
        <a routerLink="/login" class="login-ayuda-btn">← Volver al inicio de sesión</a>
      </form>
    </div>
  </div>
</div>
