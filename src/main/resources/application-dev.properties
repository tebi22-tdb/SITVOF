# Desarrollo local con front en :4200 — activar con --spring.profiles.active=dev
server.servlet.session.cookie.domain=localhost
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
# Default localhost. Para BD remota: exportar SIT_MONGODB_URI (no hardcodear IP en el repo).
spring.data.mongodb.uri=${SIT_MONGODB_URI:mongodb://127.0.0.1:27017/sit_titulacion?connectTimeoutMS=10000&serverSelectionTimeoutMS=5000&socketTimeoutMS=5000}

# JWT solo para desarrollo local (prod usa SIT_JWT_SECRET sin fallback).
sit.jwt.secret=${SIT_JWT_SECRET:sitvo-dev-only-jwt-secret-do-not-use-in-prod}

# Seeds de prueba solo en desarrollo local (nunca en prod).
sit.seed.enabled=true
sit.seed.users.enabled=true
sit.seed.sync-admin-credentials=false
# Claves solo para perfil `dev`. En prod no se cargan (seed de usuarios = false).
sit.seed.users.coordinador.password=${SIT_SEED_COORDINADOR_PASSWORD:12345}
sit.seed.users.admin.password=${SIT_SEED_ADMIN_PASSWORD:sitvo2026}
sit.seed.users.academico.password=${SIT_SEED_ACADEMICO_PASSWORD:12345}
