# Producción en VPS — activar con: --spring.profiles.active=prod
# Secretos y rutas sensibles solo por variables de entorno (no commitear valores reales).

sit.jwt.secret=${SIT_JWT_SECRET}
sit.cert.base-url=${SIT_CERT_BASE_URL:https://sitvo.net}
sit.cert.keystore-password=${SIT_KEYSTORE_PASSWORD}

# MongoDB local en el servidor (usuario/contraseña en la URI)
spring.data.mongodb.uri=${SIT_MONGODB_URI:mongodb://127.0.0.1:27017/sit_titulacion}

sit.cert.keystore-path=${SIT_KEYSTORE_PATH:/opt/sit/keystore/sit-keystore.p12}

# Seguridad: no crear/sincronizar cuentas de prueba.
sit.seed.enabled=${SIT_SEED_ENABLED:false}
sit.seed.users.enabled=${SIT_SEED_USERS_ENABLED:false}
sit.seed.sync-admin-credentials=${SIT_SEED_SYNC_ADMIN:false}
# Sin contraseñas de seed en prod (aunque alguien active SIT_SEED_USERS_ENABLED por error,
# sin estas vars no se crean cuentas).
sit.seed.users.coordinador.password=${SIT_SEED_COORDINADOR_PASSWORD:}
sit.seed.users.admin.password=${SIT_SEED_ADMIN_PASSWORD:}
sit.seed.users.academico.password=${SIT_SEED_ACADEMICO_PASSWORD:}
