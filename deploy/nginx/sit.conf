# SITVO — copiar al servidor como /etc/nginx/conf.d/sit.conf
# (o incluir desde sites-available según tu distro). Luego: sudo nginx -t && sudo systemctl reload nginx
#
# client_max_body_size evita 413 Request Entity Too Large en POST /api/egresados con PDF.

server {
    listen 80;
    # Sustituir por tu dominio o IP pública al copiar al servidor (no dejar datos reales en el repo).
    server_name TU_DOMINIO_O_IP;

    client_max_body_size 100M;

    root /var/www/sit;
    index index.html;

    # Archivos estáticos reales (logos, pdfjs…). Sin fallback a index.html.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Crear usuario espera hasta 60s el SMTP antes de devolver temporales.
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
